<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#E31837"/>
  <g transform="translate(256,256)">
    <!-- Train body -->
    <rect x="-70" y="-120" width="140" height="200" rx="20" fill="white"/>
    <!-- Windows -->
    <rect x="-50" y="-100" width="100" height="45" rx="8" fill="#E31837" opacity="0.3"/>
    <!-- Door -->
    <rect x="-20" y="-40" width="40" height="70" rx="4" fill="#E31837" opacity="0.2"/>
    <!-- Headlight -->
    <circle cx="-35" cy="-110" r="8" fill="#FFD700"/>
    <circle cx="35" cy="-110" r="8" fill="#FFD700"/>
    <!-- Wheels -->
    <rect x="-75" y="80" width="150" height="12" rx="6" fill="white" opacity="0.7"/>
    <circle cx="-45" cy="92" r="14" fill="white"/>
    <circle cx="45" cy="92" r="14" fill="white"/>
    <circle cx="-45" cy="92" r="8" fill="#E31837"/>
    <circle cx="45" cy="92" r="8" fill="#E31837"/>
    <!-- Rail lines -->
    <rect x="-100" y="106" width="200" height="4" rx="2" fill="white" opacity="0.5"/>
    <!-- Speed lines -->
    <rect x="-130" y="-80" width="40" height="3" rx="1.5" fill="white" opacity="0.4"/>
    <rect x="-140" y="-40" width="50" height="3" rx="1.5" fill="white" opacity="0.3"/>
    <rect x="-125" y="0" width="35" height="3" rx="1.5" fill="white" opacity="0.4"/>
  </g>
</svg>
